<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile & To-do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background-color: #f0f7f1;
            color: #263b2c;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 35px;
            padding: 35px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(34, 100, 55, 0.12);
        }

        .profile {
            flex: 1;
            text-align: center;
            padding: 15px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #d5ead9;
        }

        .profile h1 {
            color: #287747;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .profile p {
            line-height: 1.7;
            color: #53675a;
        }

        .profile a {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 18px;
            background-color: #e5f3e8;
            color: #237747;
            text-decoration: none;
            border-radius: 8px;
        }

        .profile a:hover {
            background-color: #cce8d2;
        }

        .todo-section {
            flex: 1.2;
            padding: 15px;
        }

        .todo-section h2 {
            color: #287747;
            margin-top: 0;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todo-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbdccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #todo-input:focus {
            border-color: #39965b;
        }

        #add-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background-color: #318451;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #add-btn:hover {
            background-color: #24683e;
        }

        #todo-list {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px;
            background-color: #f4f9f4;
            border: 1px solid #e0eee2;
            border-radius: 8px;
        }

        #todo-list li span {
            overflow-wrap: anywhere;
        }

        .delete-btn {
            flex-shrink: 0;
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            background-color: #dcefe0;
            color: #287747;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .main-card {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .profile,
            .todo-section {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="main-card">
        <div class="profile">
            <img
                src="S__35995653.jpg"
                alt="รูปโปรไฟล์"
            >

            <h1>Krittin Benjachart</h1>

            <p>
                รหัสนักศึกษา: 69070003<br>
                สาขาวิชา: เทคโนโลยีสารสนเทศ
            </p>

            <p>
                ผมเป็นนักศึกษาที่สนใจการเขียนโปรแกรม
                และการพัฒนาเว็บไซต์ ชอบเล่นเกม วาดรูป และฟังเพลง
            </p>

            <a href="https://www.instagram.com/august_ks.x/">
                ติดต่อ
            </a>
        </div>

        <!-- ส่วน To-do List -->
        <div class="todo-section">
            <h2>To-do List</h2>

            <div class="input-area">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="พิมพ์สิ่งที่ต้องทำ..."
                >

                <button type="button" id="add-btn">
                    เพิ่ม
                </button>
            </div>

            <ul id="todo-list">
                <li>
                    <span>อ่านหนังสือ</span>
                    <button type="button" class="delete-btn">ลบ</button>
                </li>

                <li>
                    <span>ทำการบ้าน</span>
                    <button type="button" class="delete-btn">ลบ</button>
                </li>

                <li>
                    <span>ฝึกเขียน Python</span>
                    <button type="button" class="delete-btn">ลบ</button>
                </li>

                <li>
                    <span>ทำโปรเจกต์เว็บไซต์</span>
                    <button type="button" class="delete-btn">ลบ</button>
                </li>
            </ul>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
